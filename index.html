<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .card-open {border-top: 4px solid #22c55e;}
        .card-closed {border-top: 4px solid #a855f7;}
    </style>
    </head>
    <body class="bg-gray-50 min-h-screen">
      <!-- Login Page -->
       <section id="login-page" class="flex-col items-center justify-center min-h-screen">
        <div class="card w-96 bg-base-100 shadow-xl p-8 border border-gray-200">
            <div class="flex flex-col items-center mb-6">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="Logo" class="w-16 mb-4">
                <h1 class="text-2xl font-bold">GitHub code Issues Tracker</h1>
                <p class="text-gray-500 text-sm">Explore and manage GitHub Issues </p>
            </div>
       
        <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text">Username</span></label>
            <input type="text" id="username" placeholder="Enter username" class="input input-bordered w-full"/>
        </div>
        <div class="form-control w-full mb-6">
            <label class="label"><span class="label-text">Password</span></label>
            <input type="password" id="password" placeholder="Enter password" class="input input-bordered w-full"/>
        </div>
        <button id="login-btn" class="btn btn-primary w-full text-white bg-indigo-600 border-none hover:bg-indigo-700">Sign In</button>
       <div class="mt-6 p-4 bg-blue-50 rounder-lg text-center text-xs text-blue-800">
        <p>Username: <strong>admin</strong></p>
         <p>Password: <strong>admin123</strong></p>       

       </div>
        </div>
    </section> 
    
    <!-- Main Dashboard (Hidden by default)-->
     <section id="main-page" class="hidden">
        <nav class="navbar bg-white shdow-sm px-4 md:px-12 py-4">
            <div class="flex-1">
             <a class="text-xl font-bold flex items-center gap-2">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" class="w-6" alt="">GitHub Issues Tracker
             </a>
            </div>
            <div class="flex-none gap-2">
                <div class="join">
                    <input id="search-input" class="input input-bordered join-item" placeholder="Search issues..."/>
                    <button id="search-btn" class="btn btn-primary join-item text-white bg-indigo-600 border-none">Search</button>
                </div>
            </div>
        </nav>
        <main class="max-w-7xl mx-auto p-4 mt-8">
            <!-- Tabs -->
             <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <div role="tablist" class="tabs tabs-boxed bg-gray-200">
                    <a role="tab" class="tab tab-active" onclick="filterIssues('all', this)">All</a>
                    <a role="tab" class="tab" onclick="filterIssues('open', this)">Open</a>
                    <a role="tab" class="tab" onclick="filterIssues('closed', this)">Closed</a>
                </div>
        <div class="flex gap-4 text-sm font-medium">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-500"></span>Open</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-purple-500"></span>Closed</span>
        </div>
        
        
             </div>

  <!--Issues Grid-->
  <div id="loading-spinner" class="flex justify-center my-10 hidden">
    <span class="loading loading-spinner loading-lg text-indigo-600"></span>
  </div>
  <div id="issues-grid" class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <!--Cards will be injected here-->
  </div>           
        </main>
     </section>
  <!-- Issue Details Modal -->
   <dialog id="issue_modal" class="modal">
    <div class="modal-box w-11/12 max-w-2xl">
        <h3 id="modal-title" class="font-bold text-2xl"></h3>
        <div id="modal-badge-container" class="my-2"></div>
        <p id="modal-desc" class="py-4 text-gray-600"></p>
        <div class="divider"></div>
        <div class="grid grid-cols-2 gap-4 text-sm">
            <p><strong>Author:</strong> <span id="modal-author"></span></p>
            <p><strong>Created:</strong> <span id="modal-created"></span></p>
            <p><strong>Label:</strong> <span id="modal-label"></span></p>
           <p><strong>Created:</strong> <span id="modal-date"></span></p>
        </div>
        <div class="modal-action">
                <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
                <form method="dialog"><button class="btn btn-primary bg-indigo-600 border-none text-white">Close</button></form>
            </div>
    </div>
   </dialog>   
<script src="script.js"></script>
    </body>
</html>
