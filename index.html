<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .card-open {border-top: 4px solid #22c55e;}
        .card-closed {border-top: 4px solid #a855f7;}
    </style>
    </head>
    <body class="bg-gray-50 min-h-screen">
      <!-- Login Page -->
       <section id=" login-page" class="flex-col items-center justify-center min-h-screen">
        <div class="card w-96 bg-base-100 shadow-xl p-8 border border-gray-200">
            <div class="flex flex-col items-center mb-6">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="Logo" class="w-16 mb-4">
                <h1 class="text-2xl font-bold">GitHub code Issues Tracker</h1>
                <p class="text-gray-500 text-sm">Explore and manage GitHub Issues </p>
            </div>
       
        <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text">Username</span></label>
            <input type="text" id="username" placeholder="Enter username" class="input input-bordered w-full"/>
        </div>
        <div class="form-control w-full mb-6">
            <label class="label"><span class="label-text">Password</span></label>
            <input type="password" id="password" placeholder="Enter password" class="input input-bordered w-full"/>
        </div>
        <button id="login-btn" class="btn btn-primary w-full text-white bg-indigo-600 border-none hover:bg-indigo-700">Sign In</button>
       <div class="mt-6 p-4 bg-blue-50 rounder-lg text-center text-xs text-blue-800">
        <p>Username: <strong>admin</strong></p>
         <p>Password: <strong>admin123</strong></p>       

       </div>
        </div>
    </section>  

    </body>
</html>
